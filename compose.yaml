services:
  db:
    image: postgres:16
    container_name: lastmile-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lastmile
      POSTGRES_PASSWORD: lastmile
      POSTGRES_DB: lastmile
    ports:
      - "5432:5432"
    volumes:
      - lastmile_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lastmile -d lastmile"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  lastmile_postgres_data: